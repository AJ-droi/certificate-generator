# Local database for development and tests.
#   npm run db:up     start Postgres in the background
#   npm run db:down   stop it (data is kept in the "pgdata" volume)
services:
  db:
    image: postgres:16-alpine
    container_name: certificate-generator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: certificate_generator
    ports:
      # Host port 5433 so it doesn't clash with a Postgres already running on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
