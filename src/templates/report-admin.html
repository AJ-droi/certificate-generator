<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certificate Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 text-slate-900">
    <main class="max-w-6xl mx-auto p-6">
      <header class="mb-4">
        <h1 class="text-2xl font-bold">Certificate Admin</h1>
        <p class="text-sm text-slate-600">Create or update certificate records in the local DB.</p>
      </header>

      <section class="bg-white border rounded p-4 mb-4">
        <div class="flex flex-wrap items-end gap-3">
          <label class="text-sm">
            <span class="block mb-1">Select Certificate</span>
            <select id="certificateSelect" class="border rounded px-3 py-2 min-w-80"></select>
          </label>
          <button id="loadBtn" class="px-4 py-2 bg-slate-900 text-white rounded">Load</button>
          <button id="newBtn" class="px-4 py-2 bg-slate-200 rounded">New</button>
        </div>
      </section>

      <form id="reportForm" class="bg-white border rounded p-4 space-y-4">
        <div class="grid md:grid-cols-3 gap-3">
          <label class="text-sm">Certificate No
            <input name="certificateNo" class="border rounded px-3 py-2 w-full" required />
          </label>
          <label class="text-sm">Exam Date
            <input name="examDate" class="border rounded px-3 py-2 w-full" />
          </label>
          <label class="text-sm">Report Date
            <input name="reportDate" class="border rounded px-3 py-2 w-full" />
          </label>
          <label class="text-sm">Colour Code
            <input name="colorCode" class="border rounded px-3 py-2 w-full" />
          </label>
          <label class="text-sm">Employer
            <input name="employerName" class="border rounded px-3 py-2 w-full" />
          </label>
          <label class="text-sm">Premises
            <input name="premisesAddress" class="border rounded px-3 py-2 w-full" />
          </label>
          <label class="text-sm">Relevant Standard
            <input name="relevantStandard" class="border rounded px-3 py-2 w-full" />
          </label>
          <label class="text-sm">Defect Sheet Attached
            <select name="defectSheetAttached" class="border rounded px-3 py-2 w-full">
              <option value="false">No</option>
              <option value="true">Yes</option>
            </select>
          </label>
        </div>

        <fieldset class="border rounded p-3">
          <legend class="px-1 text-sm font-semibold">Reasons</legend>
          <div class="grid md:grid-cols-5 gap-2 text-sm">
            <label><input type="checkbox" name="reasonInstallation" /> Installation</label>
            <label><input type="checkbox" name="reasonSixMonthly" /> 6 Monthly</label>
            <label><input type="checkbox" name="reasonTwelveMonthly" /> 12 Monthly</label>
            <label><input type="checkbox" name="reasonWrittenScheme" /> Written Scheme</label>
            <label><input type="checkbox" name="reasonExceptional" /> Exceptional</label>
          </div>
        </fieldset>

        <div class="grid md:grid-cols-2 gap-3">
          <label class="text-sm">Inspector Name
            <input name="inspectorName" class="border rounded px-3 py-2 w-full" />
          </label>
          <label class="text-sm">Inspector Qualification
            <input name="inspectorQualification" class="border rounded px-3 py-2 w-full" />
          </label>
          <label class="text-sm">Inspector Signature Path
            <input name="inspectorSignature" class="border rounded px-3 py-2 w-full" />
          </label>
          <label class="text-sm">Checked By Name
            <input name="checkedByName" class="border rounded px-3 py-2 w-full" />
          </label>
          <label class="text-sm">Checked By Qualification
            <input name="checkedByQualification" class="border rounded px-3 py-2 w-full" />
          </label>
          <label class="text-sm">Checked By Signature Path
            <input name="checkedBySignature" class="border rounded px-3 py-2 w-full" />
          </label>
          <label class="text-sm">Checked By Date
            <input name="checkedByDate" class="border rounded px-3 py-2 w-full" />
          </label>
        </div>

        <div class="grid md:grid-cols-4 gap-3">
          <label class="text-sm">Footer Logo ISO
            <input name="logoIso" class="border rounded px-3 py-2 w-full" />
          </label>
          <label class="text-sm">Footer Logo IADC
            <input name="logoIadc" class="border rounded px-3 py-2 w-full" />
          </label>
          <label class="text-sm">Footer Logo DPR
            <input name="logoDpr" class="border rounded px-3 py-2 w-full" />
          </label>
          <label class="text-sm">Footer Logo Labour
            <input name="logoLabour" class="border rounded px-3 py-2 w-full" />
          </label>
        </div>

        <section class="border rounded p-3">
          <div class="flex items-center justify-between mb-2">
            <h2 class="text-sm font-semibold">Items</h2>
            <button type="button" id="addItemBtn" class="px-3 py-1 bg-slate-200 rounded text-sm">Add Item</button>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-xs border">
              <thead class="bg-slate-50">
                <tr>
                  <th class="border p-1">S/N</th>
                  <th class="border p-1">Identification Number</th>
                  <th class="border p-1">Description</th>
                  <th class="border p-1">WLL or SWL</th>
                  <th class="border p-1">Last Exam Date</th>
                  <th class="border p-1">Manufacture Date</th>
                  <th class="border p-1">Next Exam Date</th>
                  <th class="border p-1">Exam Reason</th>
                  <th class="border p-1">Test Details</th>
                  <th class="border p-1">Status</th>
                  <th class="border p-1">Safe To Use</th>
                  <th class="border p-1">Action</th>
                </tr>
              </thead>
              <tbody id="itemsTableBody"></tbody>
            </table>
          </div>
        </section>

        <div class="flex flex-wrap gap-3">
          <button type="submit" class="px-4 py-2 bg-blue-700 text-white rounded">Save</button>
          <a id="previewLink" target="_blank" class="px-4 py-2 bg-slate-200 rounded">Preview</a>
          <a id="generateLink" target="_blank" class="px-4 py-2 bg-emerald-600 text-white rounded">Generate PDF</a>
          <span id="message" class="text-sm text-slate-600 self-center"></span>
        </div>
      </form>
    </main>

    <script>
      const form = document.getElementById("reportForm")
      const select = document.getElementById("certificateSelect")
      const loadBtn = document.getElementById("loadBtn")
      const newBtn = document.getElementById("newBtn")
      const message = document.getElementById("message")
      const previewLink = document.getElementById("previewLink")
      const generateLink = document.getElementById("generateLink")
      const addItemBtn = document.getElementById("addItemBtn")
      const itemsTableBody = document.getElementById("itemsTableBody")

      function itemInput(name, value = "", widthClass = "w-28"){
        return `<input data-item-field="${name}" value="${String(value ?? "").replaceAll('"', "&quot;")}" class="border rounded px-1 py-1 ${widthClass}" />`
      }

      function itemRowTemplate(item = {}, index = 0){
        return `
          <tr>
            <td class="border p-1">${itemInput("sn", item.sn ?? index + 1, "w-14")}</td>
            <td class="border p-1">${itemInput("identificationNumber", item.identificationNumber, "w-28")}</td>
            <td class="border p-1">${itemInput("description", item.description, "w-48")}</td>
            <td class="border p-1">${itemInput("wllOrSwl", item.wllOrSwl, "w-24")}</td>
            <td class="border p-1">${itemInput("lastThoroughExamDate", item.lastThoroughExamDate, "w-24")}</td>
            <td class="border p-1">${itemInput("manufactureDate", item.manufactureDate, "w-24")}</td>
            <td class="border p-1">${itemInput("nextThoroughExamDate", item.nextThoroughExamDate, "w-24")}</td>
            <td class="border p-1">${itemInput("examinationReason", item.examinationReason, "w-16")}</td>
            <td class="border p-1">${itemInput("testDetails", item.testDetails, "w-24")}</td>
            <td class="border p-1">${itemInput("status", item.status, "w-16")}</td>
            <td class="border p-1">${itemInput("safeToUse", item.safeToUse, "w-16")}</td>
            <td class="border p-1 text-center">
              <button type="button" data-remove-item class="px-2 py-1 bg-red-100 rounded">Remove</button>
            </td>
          </tr>
        `
      }

      function renderItems(items = []){
        const rows = items.length ? items : [{}]
        itemsTableBody.innerHTML = rows.map((item, idx) => itemRowTemplate(item, idx)).join("")
      }

      function collectItems(){
        const rows = Array.from(itemsTableBody.querySelectorAll("tr"))
        return rows.map((row, index) => {
          const getValue = (field) => {
            const input = row.querySelector(`[data-item-field="${field}"]`)
            return input ? input.value : ""
          }

          return {
            sn: Number(getValue("sn")) || index + 1,
            identificationNumber: getValue("identificationNumber"),
            description: getValue("description"),
            wllOrSwl: getValue("wllOrSwl"),
            lastThoroughExamDate: getValue("lastThoroughExamDate"),
            manufactureDate: getValue("manufactureDate"),
            nextThoroughExamDate: getValue("nextThoroughExamDate"),
            examinationReason: getValue("examinationReason"),
            testDetails: getValue("testDetails"),
            status: getValue("status"),
            safeToUse: getValue("safeToUse")
          }
        }).filter((item) => {
          return item.identificationNumber || item.description || item.wllOrSwl
        })
      }

      function setLinks(certificateNo){
        const encoded = encodeURIComponent(certificateNo || "")
        previewLink.href = encoded ? `/report/${encoded}` : "#"
        generateLink.href = encoded ? `/report/${encoded}/generate` : "#"
      }

      function fillForm(report){
        form.certificateNo.value = report.certificateNo || ""
        form.examDate.value = report.examDate || ""
        form.reportDate.value = report.reportDate || ""
        form.colorCode.value = report.colorCode || ""
        form.employerName.value = report.employerName || ""
        form.premisesAddress.value = report.premisesAddress || ""
        form.relevantStandard.value = report.relevantStandard || ""
        form.defectSheetAttached.value = String(Boolean(report.defectSheetAttached))
        form.reasonInstallation.checked = Boolean(report.reasons && report.reasons.installation)
        form.reasonSixMonthly.checked = Boolean(report.reasons && report.reasons.sixMonthly)
        form.reasonTwelveMonthly.checked = Boolean(report.reasons && report.reasons.twelveMonthly)
        form.reasonWrittenScheme.checked = Boolean(report.reasons && report.reasons.writtenScheme)
        form.reasonExceptional.checked = Boolean(report.reasons && report.reasons.exceptional)
        form.inspectorName.value = (report.inspector && report.inspector.name) || ""
        form.inspectorQualification.value = (report.inspector && report.inspector.qualification) || ""
        form.inspectorSignature.value = (report.inspector && report.inspector.signature) || ""
        form.checkedByName.value = (report.checkedBy && report.checkedBy.name) || ""
        form.checkedByQualification.value = (report.checkedBy && report.checkedBy.qualification) || ""
        form.checkedBySignature.value = (report.checkedBy && report.checkedBy.signature) || ""
        form.checkedByDate.value = (report.checkedBy && report.checkedBy.date) || ""
        form.logoIso.value = (report.footerLogos && report.footerLogos.iso) || ""
        form.logoIadc.value = (report.footerLogos && report.footerLogos.iadc) || ""
        form.logoDpr.value = (report.footerLogos && report.footerLogos.dpr) || ""
        form.logoLabour.value = (report.footerLogos && report.footerLogos.labour) || ""
        renderItems(report.items || [])
        setLinks(report.certificateNo || "")
      }

      function clearForm(){
        form.reset()
        renderItems([])
        setLinks("")
      }

      async function fetchCertificates(){
        const response = await fetch("/report/api/certificates")
        const reports = await response.json()
        select.innerHTML = reports
          .map((report) => `<option value=\"${report.certificateNo}\">${report.certificateNo}</option>`)
          .join("")

        if(reports[0]){
          fillForm(reports[0])
        }else{
          clearForm()
        }
      }

      loadBtn.addEventListener("click", async () => {
        if(!select.value){
          return
        }
        const response = await fetch(`/report/api/certificates/${encodeURIComponent(select.value)}`)
        if(!response.ok){
          return
        }
        const report = await response.json()
        fillForm(report)
      })

      newBtn.addEventListener("click", () => {
        clearForm()
      })

      addItemBtn.addEventListener("click", () => {
        itemsTableBody.insertAdjacentHTML("beforeend", itemRowTemplate({}, itemsTableBody.querySelectorAll("tr").length))
      })

      itemsTableBody.addEventListener("click", (event) => {
        if(!event.target.matches("[data-remove-item]")){
          return
        }

        const row = event.target.closest("tr")
        if(row){
          row.remove()
        }

        if(!itemsTableBody.querySelector("tr")){
          renderItems([])
        }
      })

      form.certificateNo.addEventListener("input", (event) => {
        setLinks(event.target.value)
      })

      form.addEventListener("submit", async (event) => {
        event.preventDefault()
        message.textContent = "Saving..."

        const payload = Object.fromEntries(new FormData(form).entries())
        payload.items = collectItems()

        const response = await fetch("/report/api/certificates", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        })

        if(!response.ok){
          const result = await response.json()
          message.textContent = result.message || "Save failed"
          return
        }

        const saved = await response.json()
        message.textContent = `Saved ${saved.certificateNo}`
        await fetchCertificates()
        select.value = saved.certificateNo
        fillForm(saved)
      })

      fetchCertificates()
    </script>
  </body>
</html>
