# Runs on every push (any branch) and pull request:
#   checks — lint, type check, unit tests, and a production build of the dashboards
#   api    — migration check and API end-to-end tests (Postgres, Redis, S3, Chrome)
#   ui     — browser tests of both dashboards against the built app (Playwright)
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests use TEST_DATABASE_URL / UI_TEST_DATABASE_URL (the Postgres services below).
  TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/certificate_generator_test
  UI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/certificate_generator_ui_test
  REDIS_URL: redis://127.0.0.1:6379
  # Ubuntu runners block the Chrome sandbox's user namespaces; the test
  # templates are ours, so run Chrome without it here only.
  PUPPETEER_NO_SANDBOX: "true"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: certificate_generator_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # For the migration check (npm run db:check uses the app's database settings).
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/certificate_generator_test
      # S3 storage tests (apps/api/test/e2e/storage-s3.test.js) against SeaweedFS, started below.
      S3_TEST_ENDPOINT: http://127.0.0.1:8333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Explicit, so it doesn't depend on npm running Puppeteer's install script.
      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome
      # Started here rather than as a service: services can't be given a command.
      - name: Start SeaweedFS (S3-compatible store)
        run: |
          docker run -d --name s3 -p 8333:8333 \
            -v "$PWD/docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48 server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:8333 && exit 0
            sleep 1
          done
          docker logs s3
          exit 1
      - name: Random APP_SECRET for this run
        run: echo "APP_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - name: Migrations apply cleanly and match the entities
        run: npm run db:check
      - run: npm run test:e2e

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: certificate_generator_ui_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browsers (Chrome for PDFs, Chromium for Playwright)
        run: |
          npx puppeteer browsers install chrome
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: Random APP_SECRET for this run
        run: echo "APP_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - run: npm run test:ui
      - name: Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
