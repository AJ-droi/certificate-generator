# Runs on every push (any branch) and pull request: lint, unit tests, migration check, and the
# end-to-end tests against real Postgres, Redis, an S3-compatible store and headless Chrome.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Puppeteer's Chrome isn't needed for lint and unit tests.
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: certificate_generator_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: certificate_generator_test
      PGDATABASE_TEST: certificate_generator_test
      REDIS_URL: redis://127.0.0.1:6379
      # S3 storage tests (test/e2e/storage-s3.test.js) against SeaweedFS, started below.
      S3_TEST_ENDPOINT: http://127.0.0.1:8333
      # Ubuntu runners block the Chrome sandbox's user namespaces; the test
      # templates are ours, so run Chrome without it here only.
      PUPPETEER_NO_SANDBOX: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Explicit, so it doesn't depend on npm running Puppeteer's install script.
      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome
      # Started here rather than as a service: services can't be given a command.
      - name: Start SeaweedFS (S3-compatible store)
        run: |
          docker run -d --name s3 -p 8333:8333 \
            -v "$PWD/docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48 server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:8333 && exit 0
            sleep 1
          done
          docker logs s3
          exit 1
      - name: Random APP_SECRET for this run
        run: echo "APP_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - name: Migrations apply cleanly and match the entities
        run: npm run db:check
      - run: npm run test:e2e
